# Imports the base disk once; user VMs clone it (manifests.virtualMachine → sourceRef).
# Replace "current" with a dated build (e.g. noble/20261015/) so images are reproducible.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: ubuntu-24.04-cuda
  namespace: tensora-images
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  storage:
    storageClassName: tensora-block
    resources:
      requests:
        storage: 20Gi
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataSource
metadata:
  name: ubuntu-24.04-cuda
  namespace: tensora-images
spec:
  source:
    pvc:
      name: ubuntu-24.04-cuda
      namespace: tensora-images
