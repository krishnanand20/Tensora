# CPU instances, and fallback, ADR-0010) get a planned cpu_nodes group in Phase 2.
all:
  children:
    gpu_nodes:
      children:
        k3s_servers:
          hosts:
            gpu-node-01:
              ansible_host: 10.0.10.11
              node_ip: 10.0.10.11
              wireguard_address: 10.99.0.11/24
              gpu_workload_config: container
        k3s_agents:
          hosts: {}
