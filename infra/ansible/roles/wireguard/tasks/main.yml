- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard-tools
    state: present

- name: Write wg0 config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
  notify: Restart wireguard

- name: Enable wg0
  ansible.builtin.systemd_service:
    name: wg-quick@wg0
    enabled: true
    state: started
