- name: Install base packages
  ansible.builtin.apt:
    name:
      - chrony
      - curl
      - jq
      - ipmitool
      - nvme-cli
      - pciutils
      - lvm2
      - open-iscsi # Longhorn
      - nfs-common # Longhorn RWX
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Enable iSCSI daemon for Longhorn
  ansible.builtin.systemd_service:
    name: iscsid
    enabled: true
    state: started

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/tensora.conf
    content: |
      overlay
      br_netfilter
      iscsi_tcp
    mode: "0644"

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter, iscsi_tcp]

- name: Kernel parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-tensora.conf
    reload: true
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      net.ipv4.ip_forward: 1
      net.bridge.bridge-nf-call-iptables: 1
      fs.inotify.max_user_instances: 8192
      fs.inotify.max_user_watches: 1048576
      vm.max_map_count: 262144

- name: Harden SSH (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/90-tensora.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
  notify: Restart ssh

- name: Security-only unattended upgrades, never automatic reboots
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52tensora-unattended
    content: |
      Unattended-Upgrade::Allowed-Origins { "${distro_id}:${distro_codename}-security"; };
      Unattended-Upgrade::Automatic-Reboot "false";
      // Kernel and NVIDIA updates must go through a drain (docs/runbooks/add-node.md).
      Unattended-Upgrade::Package-Blacklist { "linux-" ; "nvidia-" ; };
    mode: "0644"
