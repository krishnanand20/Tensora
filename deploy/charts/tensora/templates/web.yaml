apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensora-web
  labels:
    {{- include "tensora.labels" . | nindent 4 }}
    app.kubernetes.io/name: tensora-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tensora-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tensora-web
    spec:
      automountServiceAccountToken: false
      {{- include "tensora.podSecurityContext" . | nindent 6 }}
      containers:
        - name: web
          image: {{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: tensora-web
  labels:
    {{- include "tensora.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: tensora-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tensora-web
  labels:
    {{- include "tensora.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https-app
  hostnames:
    - app.{{ .Values.domain }}
  rules:
    - backendRefs:
        - name: tensora-web
          port: 80
