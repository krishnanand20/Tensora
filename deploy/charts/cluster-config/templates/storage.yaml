# tensora-block is the only StorageClass Tensora references (TENSORA_STORAGE_CLASS), so moving
# from Longhorn to Ceph changes this file, not the control plane. StorageClass parameters
# are immutable: switching provisioners means deleting and recreating the class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: tensora-block
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
{{- if eq .Values.storage.provisioner "longhorn" }}
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: {{ .Values.storage.replicas | quote }}
  dataLocality: best-effort
{{- else if eq .Values.storage.provisioner "rook-ceph" }}
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: ceph-blockpool
  imageFormat: "2"
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
{{- else }}
{{- fail "storage.provisioner must be longhorn or rook-ceph" }}
{{- end }}
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
