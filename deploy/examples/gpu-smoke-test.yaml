# Container-mode GPU check (runbook 02). Node must be labeled nvidia.com/gpu.workload.config=container.
#   kubectl apply -f deploy/examples/gpu-smoke-test.yaml && kubectl logs -f pod/gpu-smoke-test
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvcr.io/nvidia/cuda:12.8.1-base-ubuntu24.04
      command: [nvidia-smi]
      resources:
        limits:
          nvidia.com/gpu: 1
