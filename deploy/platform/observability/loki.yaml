# Loki in single-binary mode with filesystem storage — enough for 1–5 nodes.
# Move to simple-scalable mode with the object store when log volume grows.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 336h

singleBinary:
  replicas: 1
  persistence:
    storageClass: tensora-block
    size: 50Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
