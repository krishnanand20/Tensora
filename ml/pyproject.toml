[project]
name = "tensora-ml"
version = "0.1.0"
description = "Tensora ML layer: model ingestion and validation, endpoint benchmarking, GPU burn-in."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "huggingface-hub>=0.24",
  "boto3>=1.34",
]

[project.optional-dependencies]
# Burn-in needs CUDA PyTorch; install only on GPU nodes / in the burn-in image.
burnin = ["torch>=2.4"]

[project.scripts]
tensora-ml = "tensora_ml.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tensora_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src/ directly, so tests don't depend on the editable-install .pth file
# (macOS can mark it hidden, and Python 3.12+ then ignores it).
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
